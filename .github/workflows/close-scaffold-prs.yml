# ─── CGRF Header ───────────────────────────────────────────────
# File:         .github/workflows/close-scaffold-prs.yml
# Stage:        11_COMMIT
# SRS:          SRS-CN-FINANCE-GOVERNANCE-001
# CAPS:         pending
# CK:           pending
# Dispatch:     DISP-GOVERNANCE-finance
# Seat:         BITS-CODEGEN
# Owner:        Citadel Nexus Inc.
# Created:      2026-10-20
# Depends:      .bits/out/DISP-GOVERNANCE-finance/closeout.test.ts, .bits/out/DISP-GOVERNANCE-finance/closeout.md
# EnumType:     Workflow
# EnumEdges:    DEPENDS_ON .bits/out/DISP-GOVERNANCE-finance/closeout.test.ts; DEPENDS_ON .bits/out/DISP-GOVERNANCE-finance/closeout.md
# DAG Node:     none
# Intent:       Close only explicitly reviewed obsolete scaffold PRs after revalidating their frozen heads.
# ───────────────────────────────────────────────────────────────

name: Finance scaffold closeout

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/close-scaffold-prs.yml
      - .github/workflows/ci.yml
      - .bits/out/DISP-GOVERNANCE-finance/closeout.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/close-scaffold-prs.yml
      - .github/workflows/ci.yml
      - .bits/out/DISP-GOVERNANCE-finance/closeout.test.ts
  workflow_dispatch:
    inputs:
      close_reviewed:
        description: Close the six reviewed obsolete scaffold PRs (false previews only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: finance-scaffold-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Finance closeout policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test .bits/out/DISP-GOVERNANCE-finance/closeout.test.ts

  closeout:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'citadel-nexus/guild-finance' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Preview or close reviewed scaffold PRs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          CLOSE_REVIEWED: ${{ inputs.close_reviewed }}
        with:
          script: |
            const repo = context.repo;
            const repository = `${repo.owner}/${repo.repo}`;
            if (repository !== 'citadel-nexus/guild-finance' ||
                context.eventName !== 'workflow_dispatch' ||
                context.ref !== `refs/heads/${context.payload.repository.default_branch}`) {
              throw new Error('Closeout is restricted to this repository and its default branch.');
            }
            const reviewed = [
              [1, '546585fd11505fd33105a2ee9c97f840664730eb', 'automated/scaffold/1772806151', 'initial'],
              [2, '595a7d7a2416fb38f3372325c238bb837649c43d', 'automated/scaffold/1772806216', 'initial'],
              [3, '3abdade3bae531a115eeeb8bebb280c45cfcb27e', 'automated/scaffold/1772806932', 'initial'],
              [4, 'afd3c0bc57997131e48467b7b366b9001deb0d7f', 'automated/scaffold/1772808426', 'initial'],
              [5, '677f8a83b61a702f5bf0ad7d4c1beb9af266c192', 'automated/scaffold/1772813962', 'full'],
              [6, '034fbee2869c8d3d301950b033919a3403b53bfa', 'automated/scaffold/1772814192', 'full'],
            ];
            const close = process.env.CLOSE_REVIEWED === 'true';
            const rows = [];
            const eligible = [];
            const matches = (pr, [number, sha, branch, kind]) =>
              pr.number === number && pr.head.sha === sha && pr.head.ref === branch &&
              pr.head.repo?.full_name === repository && pr.base.repo?.full_name === repository &&
              pr.base.ref === 'main' && pr.title === `chore: ${kind} scaffold for guild-finance`;
            // Preflight every candidate before making any write.
            for (const candidate of reviewed) {
              const {data: pr} = await github.rest.pulls.get({...repo, pull_number: candidate[0]});
              if (pr.state !== 'open' || pr.merged) {
                rows.push([String(candidate[0]), 'Already closed/merged; skipped']);
                continue;
              }
              if (!matches(pr, candidate)) {
                throw new Error(`PR #${candidate[0]} changed since review; no closeout writes performed.`);
              }
              eligible.push(candidate);
            }
            for (const candidate of eligible) {
              if (close) {
                // Recheck immediately before closing; never delete branches or merge code.
                const {data: pr} = await github.rest.pulls.get({...repo, pull_number: candidate[0]});
                if (pr.state !== 'open' || pr.merged) continue;
                if (!matches(pr, candidate)) throw new Error(`PR #${candidate[0]} changed during closeout.`);
                await github.rest.pulls.update({...repo, pull_number: candidate[0], state: 'closed'});
              }
              rows.push([String(candidate[0]), close ? 'Closed as superseded' : 'Would close as superseded']);
            }
            await core.summary.addHeading(close ? 'Reviewed scaffold closeout' : 'Dry-run scaffold closeout')
              .addTable([['PR', 'Result'], ...rows]).write();
