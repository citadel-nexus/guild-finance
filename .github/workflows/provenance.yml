name: Finance build provenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Finance provenance build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Package server and mobile build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.js
          test -s dist/public/finance-mobile.js
          mkdir -p artifacts
          tar -czf "artifacts/finance-${GITHUB_SHA}.tar.gz" dist package.json package-lock.json
      - name: Upload build archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-build-${{ github.sha }}
          path: artifacts/finance-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Finance provenance attestation
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download this run's build archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: finance-build-${{ github.sha }}
          path: artifacts
      - name: Sign SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/finance-${{ github.sha }}.tar.gz
      - name: Upload signed verification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-provenance-${{ github.sha }}
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
